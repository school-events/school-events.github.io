<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الاختبارات التفاعلي المطور</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            background-color: #eff6ff;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
        }

        /* تعديل الحاوية لتكون ملائمة تماماً وتمنع قص الصورة */
        .image-container {
            width: 100%;
            height: auto;
            min-height: 250px;
            max-height: 450px;
            background-color: #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        /* تعديل الصورة لتتناسب بشكل كامل وتظهر أبعادها الحقيقية بدون أي اقتطاع */
        .question-image {
            max-width: 100%;
            max-height: 430px;
            object-fit: contain;
            display: block;
            border-radius: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .image-container {
                max-height: 350px;
            }
            .question-image {
                max-height: 330px;
            }
        }

        .option-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-transform: uppercase;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f8fafc;
        }

        .option-btn.correct {
            background-color: #ecfdf5;
            border-color: var(--success-color);
            color: #065f46;
        }

        .option-btn.wrong {
            background-color: #fef2f2;
            border-color: var(--error-color);
            color: #991b1b;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .feedback-message {
            min-height: 24px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .feedback-message.error {
            color: var(--error-color);
        }

        .feedback-message.success {
            color: var(--success-color);
        }

        .score-container {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .score-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: var(--success-color);
        }

        .score-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-desc {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .restart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>

    "image": "https://lh7-rt.googleusercontent.com/formsz/AN7BsVAT1cmRQCQRsxzVZFGeZw7JWaBG1cjOT1GVqJfjqRMJ17Rb4UlxrOBJRvOzSOguuThMDRm6FgDF3fGSalonHn3PTruE71Xq3lvxDcPU3iK2GpYwmxfWMeXPRJKfZCJBK3ghUxWl9xgI66vXTXy6D_a2Gwo34x5TNKxWRWCKB8yOIJEie1IjbVuOf4aedFQKIb8Fr7Uwhqd_PTiez4Hi=w631?key=B7rEZS-B6bmmsmg1c_g6vw",
    "options": [],
    "correctAnswer": null
  }
];

        let currentQuestionIndex = 0;
        let canClick = true;

        const quizBox = document.getElementById('quiz-box');
        const scoreBox = document.getElementById('score-box');
        const progressText = document.getElementById('progress');
        const questionImg = document.getElementById('question-img');
        const optionsContainer = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }

            canClick = true;
            feedback.innerText = "";
            feedback.className = "feedback-message";
            optionsContainer.innerHTML = "";

            const currentQuestion = questions[currentQuestionIndex];

            progressText.innerText = `السؤال: ${currentQuestionIndex + 1} / ${questions.length}`;

            if (currentQuestion.image) {
                questionImg.src = currentQuestion.image;
                questionImg.style.display = "block";
            } else {
                questionImg.style.display = "none";
            }

            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = option;
                button.onclick = () => checkAnswer(option, button);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedOption, selectedButton) {
            if (!canClick) return;

            const currentQuestion = questions[currentQuestionIndex];
            
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.remove('wrong');
            });

            if (selectedOption === currentQuestion.correctAnswer) {
                canClick = false;
                selectedButton.classList.add('correct');
                feedback.innerText = "إجابة صحيحة! جاري الانتقال...";
                feedback.className = "feedback-message success";

                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1000);

            } else {
                selectedButton.classList.add('wrong');
                feedback.innerText = "إجابة خاطئة! حاول مرة أخرى في نفس السؤال.";
                feedback.className = "feedback-message error";
            }
        }

        function showResults() {
            quizBox.style.display = 'none';
            scoreBox.style.display = 'block';
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            scoreBox.style.display = 'none';
            quizBox.style.display = 'block';
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
